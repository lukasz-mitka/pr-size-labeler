name: Linter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up excludes
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          echo "SKIP=no-commit-to-branch" >> $GITHUB_ENV

      - name: Run pre-commit with prek
        uses: j178/prek-action@v3.1.0
