on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

name: Tests
jobs:
  tests:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: ./install-dev-dependencies.sh

      - name: Tests
        run: ./lib/bashunit tests
