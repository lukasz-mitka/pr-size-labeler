on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

name: Tests
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Verify runtime bundle is tracked
        run: git ls-files --error-unmatch dist/index.js dist/package.json

      - name: Verify committed bundle
        run: git diff --exit-code -- dist
